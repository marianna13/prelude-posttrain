proposed_subsets:
  clean_completion_filter:
    status: adopted
    definition: |
      Completed and not errored/cut:
        - last assistant turn contains `task_complete` OR `result`/`judgment` is success
          (`1.0` / `success` / `judgment=Yes`)
        - last role is assistant
        - last assistant JSON is brace-balanced (not cut mid-object)
        - last assistant is non-empty
        - `result` is not an error/timeout token (AgentTimeoutError, *Error, timeout, ...)
      Pass rate on unique usable rows: 85.8% (1,281,042 / 1,492,870 per-shard-unique;
      777,730 of those also have recovery-looking user turns).
    stats: /e/data1/datasets/playground/ot/agenttrove-sft-v1/completed_clean_filter_stats.json
  balanced_agentic_v2_clean_completion:
    status: materialized
    parent: balanced_agentic_v1
    policy: |
      Same source cap as v1 (20k/source, exclude exp_* / unknown, dedup),
      plus the clean_completion_filter. Preferred agentic base for the Grug mix.
    materialized_row_count: 347745
    materialized: /e/data1/datasets/playground/ot/agenttrove-sft-v1/balanced_agentic_v2_clean_completion
    subset_manifest: /e/data1/datasets/playground/ot/agenttrove-sft-v1/balanced_agentic_v2_clean_completion/subset_manifest.json
    dropped_highlights: {not_completed: 45928, errored_or_cut: 41733}
  balanced_agentic_recovery_v1:
    status: materialized
    parent: balanced_agentic_v2_clean_completion
    policy: |
      v2 clean-completion plus recovery-looking user turn (ERROR / parse / retry /
      failed / Invalid). Target pool for the "agentic recover" mix component.
    materialized: /e/data1/datasets/playground/ot/agenttrove-sft-v1/balanced_agentic_recovery_v1
    subset_manifest: /e/data1/datasets/playground/ot/agenttrove-sft-v1/balanced_agentic_recovery_v1/subset_manifest.json
    materialized_row_count: 241083
    global_recovery_pass_before_cap: 777730
  balanced_agentic_v1:
    status: proposed
    goal: balanced agentic SFT subset for Grug format/recovery mix (issue 0048 / GH #50)
    policy: |
      Drop null conversations and identical duplicate (trial_name, run_id, episode) rows.
      Keep the first row per (trial_name, run_id, episode); content-different variants are
      available as a separate variant pool and are not in this cut.
      Exclude ablation sources (exp_tas/exp_rpt/exp_rle) and `unknown` — exp_* is sampling
      ablations of the same tasks (~28% of usable) and will dominate any naive concat.
      Cap 20,000 rows per source so freelance/taskmaster/stack_exchange do not drown
      smaller agentic families.
    family_targets:
      swe_repair: {sources: [swesmith, r2egym, Inferred Bugs, defects 4j, SWEGym], usable: 137380}
      shell_cli: {sources: [nl2bash, bash textbook, staqc], usable: 69892}
      competitive_code: {sources: [code_contests, codeforces, puzzles], usable: 84821}
      freelance_general: {sources: [freelancer, taskmaster], usable: 281788}
      qa_stack: {sources: [stack_exchange, StackExchange Overflow, Qasper], usable: 158237}
      repo_tools: {sources: [repo scaffold, multifile composition, Glaive Code Assistant, Self-Instruct Naive, WikiTable Format Conversion, MagiCoder Evol Instruct], usable: 41219}
      math_science: {sources: [math, Nemotron Prism, gsm8k], usable: 16975}
      neulab_tools: {sources: [neulab], usable: 55200}
    estimated_row_count: 363476
    materialized_row_count: 363476
    materialized: /e/data1/datasets/playground/ot/agenttrove-sft-v1/balanced_agentic_v1
    subset_manifest: /e/data1/datasets/playground/ot/agenttrove-sft-v1/balanced_agentic_v1/subset_manifest.json
    cutter: rl/scripts/data/build_agenttrove_balanced_subset.py
    cutter_sha256: c47d7815626f04fbef63c65b7bc571f6c855c5954c5998ae6a02a2c8439cac66
    notes:
      - no reward column; do not filter on reward==1 (only 1.21% of usable rows have result success/1.0, almost all swesmith/r2egym)
      - prefer behavioural filters (task_complete, recovery-ish, json-format) once the grug failure taxonomy is frozen
      - 0% OpenAI-style tool turns; everything is terminus-2 inline JSON `commands`
limitations:
  - 'card schema is wrong: `conversations` not `messages`; no `reward` column; no `task_id`'
  - '7.57% published rows are null-conversation padding from exp_rle/exp_rpt/unknown merges'
  - '214,593 identical duplicate rows and 118,611 same-key different-content variants'
  - 'no reliable success label for most rows (`result` present on 12.9%, mostly AgentTimeoutError)'
  - 'exp_tas alone is 28% of usable rows and is an ablation dump, not task diversity'
  - 'this is an SFT trace corpus, not a Harbor RL task pool; do not point `data.train_data` at it'
  - 'Grug/Snowball contamination: some sources overlap known SFT mixes (nemotron-terminal lineage); not a clean eval set'
