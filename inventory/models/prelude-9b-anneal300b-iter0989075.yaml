  training_summary: >-
    Dense 9B base model (Qwen3 architecture, untied embeddings, QK-norm, 4k context) pretrained by
    OpenEuroLLM on Leonardo with a WSD schedule (~80% English + code + math, ~20% across 36 European
    languages). Branched from the stable phase at iteration ~953,312 (~8.0T tokens) and annealed for
    300B tokens to iteration 989,075. This is the plain `anneal300b` run, chosen as the SFT base for
    math/reasoning/code over the `anneal300b_multilingual1_dominant{1,2}` variants (same iteration,
    multilingual-focused mixes, uploaded 2026-10-09). The anneal data mix is not documented on the
    model card (whose README is the generic stable-phase card copied to every branch); "default mix"
    is inferred from the branch name and upload date (2026-08-14). The `prelude-anneal300b-wsm*`
    branches at the same iteration look like checkpoint averages of this run.
